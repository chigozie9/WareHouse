[pytest]
testpaths = tests
markers =
    api: REST API tests (need the backend running)
    ui: browser tests with Playwright (need backend + frontend running)
    bug: documents a known defect; marked xfail until the bug is fixed
# xfail_strict: if a "known bug" test suddenly passes, fail the run so we
# remember to remove the marker once the bug is fixed.
xfail_strict = true
addopts = -ra
